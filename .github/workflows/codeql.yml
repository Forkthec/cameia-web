name: CodeQL # análisis de seguridad automático; resultados en la pestaña "Security" de GitHub

# En cada PR y push a develop revisa solo lo que cambió; el domingo hace un barrido
# completo del repo (captura problemas que ningún PR reciente tocó).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  schedule:
    - cron: '0 6 * * 0' # domingo 06:00 UTC

permissions:
  contents: read
  security-events: write # obligatorio: así CodeQL puede publicar hallazgos en Security

jobs:
  analyze:
    name: Analizar (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Prepara el análisis para este lenguaje; no compila nada todavía.
      - name: Preparar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      # Para JS/TS no hace falta compilar de verdad: CodeQL analiza el código fuente
      # directo. "autobuild" solo existe para lenguajes que sí necesitan un build real
      # (Java, C++...); aquí es un paso vacío que se deja por consistencia con esos repos.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Ejecutar análisis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
