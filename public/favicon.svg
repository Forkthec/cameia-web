<!--
  Ícono de la pestaña (favicon): el glifo «Amanecer» de BrandMark.tsx (CM-329)
  en tono inverso sobre un cuadro índigo, para que se lea igual en pestañas
  claras y oscuras. Es un archivo estático que el navegador lee sin CSS de la
  app, por eso lleva los hex de primitives.css (indigo-500 y mustard-400)
  en vez de tokens. Si cambia el trazado de BrandMark, se copia aquí.
-->
